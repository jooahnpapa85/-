<title>근로계약서 검토기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root {
  --bg:       #F2F0EC;
  --surface:  #FFFFFF;
  --surface2: #F8F6F2;
  --border:   #E0DBD3;
  --text:     #111111;
  --sub:      #6B6760;
  --gold:     #B58E51;
  --goldtint: #F5EDD8;
  --golddim:  rgba(181,142,81,.12);
  --danger:   #B83232; --dbg: #FEF2F2; --dbd: #FCA5A5;
  --warn:     #9B6800; --wbg: #FFFBEB; --wbd: #FCD34D;
  --safe:     #286040; --sbg: #F0FDF6; --sbd: #86EFAC;
  --info:     #3B5EA6; --ibg: #EFF6FF; --ibd: #BFDBFE;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#111111; --surface:#1C1A17; --surface2:#161412; --border:#2E2A24;
    --text:#EDE9E3; --sub:#8A8680; --gold:#C9A060; --goldtint:#211D13; --golddim:rgba(201,160,96,.1);
    --danger:#F87171; --dbg:#1C0B0B; --dbd:#7F1D1D;
    --warn:#FBB70E;  --wbg:#1A1200; --wbd:#78350F;
    --safe:#4ADE80;  --sbg:#052010; --sbd:#14532D;
    --info:#93C5FD;  --ibg:#071528; --ibd:#1E3A5F;
  }
}
:root[data-theme="dark"] {
  --bg:#111111; --surface:#1C1A17; --surface2:#161412; --border:#2E2A24;
  --text:#EDE9E3; --sub:#8A8680; --gold:#C9A060; --goldtint:#211D13; --golddim:rgba(201,160,96,.1);
  --danger:#F87171; --dbg:#1C0B0B; --dbd:#7F1D1D;
  --warn:#FBB70E;  --wbg:#1A1200; --wbd:#78350F;
  --safe:#4ADE80;  --sbg:#052010; --sbd:#14532D;
  --info:#93C5FD;  --ibg:#071528; --ibd:#1E3A5F;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;font-size:14px;background:var(--bg);color:var(--text);line-height:1.6;padding-bottom:80px}

/* topbar */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.brand{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:var(--text);letter-spacing:-.02em}
.brandmark{width:26px;height:26px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#fff}
.iconbtn{background:none;border:1px solid var(--border);color:var(--sub);width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;transition:border-color .15s,color .15s}
.iconbtn:hover{border-color:var(--gold);color:var(--gold)}

/* layout */
.main{max-width:900px;margin:0 auto;padding:28px 20px 0}

/* api */
.api-toggle{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);padding:10px 14px;cursor:pointer;width:100%;font-family:inherit;font-size:13px;color:var(--sub);font-weight:500;transition:border-color .15s;margin-bottom:0}
.api-toggle:hover{border-color:var(--gold)}
.api-toggle.ok{color:var(--safe);border-color:var(--sbd)}
.api-panel{display:none;background:var(--surface);border:1px solid var(--border);border-top:none;padding:14px;margin-bottom:20px}
.api-panel.open{display:block}
.api-row{display:flex;gap:8px}
.api-input{flex:1;padding:8px 12px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:inherit;font-size:13px;outline:none}
.api-input:focus{border-color:var(--gold)}
.api-save{background:var(--gold);color:#fff;border:none;padding:0 16px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.api-hint{font-size:11px;color:var(--sub);margin-top:8px;line-height:1.7}

/* upload card */
.upload-card{background:var(--surface);border:1px solid var(--border);margin-bottom:20px}
.dropzone{padding:44px 24px;text-align:center;border:2px dashed var(--border);margin:14px;cursor:pointer;transition:border-color .2s,background .2s}
.dropzone:hover,.dropzone.over{border-color:var(--gold);background:var(--golddim)}
.dz-icon{width:44px;height:44px;margin:0 auto 14px;color:var(--sub)}
.dz-title{font-size:15px;font-weight:600;margin-bottom:6px}
.dz-sub{font-size:12px;color:var(--sub);font-weight:300}
.type-chips{display:flex;gap:6px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.chip{font-size:11px;padding:3px 8px;background:var(--goldtint);color:var(--gold);font-weight:600;letter-spacing:.04em}
#fileInput{display:none}
.paste-wrap{border-top:1px solid var(--border);padding:14px 16px}
.paste-lbl{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.paste-area{width:100%;min-height:80px;padding:10px 12px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:inherit;font-size:13px;font-weight:300;resize:vertical;outline:none}
.paste-area:focus{border-color:var(--gold)}
.analyze-btn{width:100%;padding:14px;margin-top:10px;background:var(--text);color:var(--surface);border:none;font-family:inherit;font-size:14px;font-weight:700;letter-spacing:-.01em;cursor:pointer;transition:opacity .15s}
.analyze-btn:hover{opacity:.85}
.analyze-btn:disabled{opacity:.4;cursor:not-allowed}

/* error */
.errbox{display:none;background:var(--dbg);border:1px solid var(--dbd);padding:12px 14px;font-size:13px;color:var(--danger);margin-bottom:16px}
.errbox.show{display:block}

/* loading */
.loading{display:none;text-align:center;padding:44px 24px;background:var(--surface);border:1px solid var(--border);margin-bottom:20px}
.loading.on{display:block}
.loading-txt{font-size:14px;color:var(--sub);font-weight:300;margin-bottom:4px}
.loading-step{font-size:12px;color:var(--sub);font-weight:300}
.loadbar{height:3px;background:var(--border);width:100%;max-width:300px;margin:18px auto 0;overflow:hidden;position:relative}
.loadbar::after{content:'';position:absolute;height:100%;width:40%;background:var(--gold);animation:slide 1.2s ease-in-out infinite}
@keyframes slide{0%{left:-40%}100%{left:140%}}

/* results */
.results{display:none}
.results.on{display:block}
.demo-bar{background:var(--ibg);border:1px solid var(--ibd);padding:10px 14px;font-size:12px;color:var(--info);font-weight:500;margin-bottom:14px}

/* risk banner */
.risk-banner{padding:18px 22px;margin-bottom:14px;border-left:5px solid}
.risk-banner.danger{background:var(--dbg);border-color:var(--danger)}
.risk-banner.warning{background:var(--wbg);border-color:var(--warn)}
.risk-banner.safe{background:var(--sbg);border-color:var(--safe)}
.risk-lv{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.risk-banner.danger .risk-lv{color:var(--danger)}
.risk-banner.warning .risk-lv{color:var(--warn)}
.risk-banner.safe .risk-lv{color:var(--safe)}
.risk-txt{font-size:14px;color:var(--text);line-height:1.7}

/* stat row */
.statrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.statcard{background:var(--surface);border:1px solid var(--border);padding:16px 18px}
.statcard-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.statcard-title{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sub)}
.statchip{font-size:11px;font-weight:700;padding:2px 8px;letter-spacing:.04em}
.c-danger{background:var(--dbg);color:var(--danger);border:1px solid var(--dbd)}
.c-warn  {background:var(--wbg);color:var(--warn)  ;border:1px solid var(--wbd)}
.c-safe  {background:var(--sbg);color:var(--safe)  ;border:1px solid var(--sbd)}
.c-info  {background:var(--ibg);color:var(--info)  ;border:1px solid var(--ibd)}
.statmain{font-size:20px;font-weight:700;letter-spacing:-.03em;margin-bottom:4px;font-variant-numeric:tabular-nums}
.statsub{font-size:12px;color:var(--sub);font-weight:300;line-height:1.6}

/* section label */
.sec-lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.sec-lbl::before{content:'';display:block;width:12px;height:1px;background:var(--gold)}

/* issues */
.issue-list{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.issue{background:var(--surface);border:1px solid var(--border);border-left:4px solid;padding:14px 16px}
.issue.sv-위반{border-left-color:var(--danger)}
.issue.sv-주의{border-left-color:var(--warn)}
.issue.sv-정보{border-left-color:var(--border)}
.issue-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.issue-cat{font-size:13px;font-weight:700}
.issue-sv{font-size:10px;font-weight:700;padding:2px 7px;letter-spacing:.06em}
.sv-위반 .issue-sv{background:var(--dbg);color:var(--danger)}
.sv-주의 .issue-sv{background:var(--wbg);color:var(--warn)}
.sv-정보 .issue-sv{background:var(--surface2);color:var(--sub)}
.issue-desc{font-size:13px;color:var(--text);margin-bottom:5px;line-height:1.7}
.issue-basis{font-size:11px;color:var(--sub);font-weight:300;margin-bottom:5px}
.issue-rec{font-size:12px;color:var(--gold);font-weight:600;border-top:1px solid var(--border);padding-top:8px;margin-top:4px}

/* two col */
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.ccard{background:var(--surface);border:1px solid var(--border);padding:16px}
.clist{list-style:none;display:flex;flex-direction:column;gap:8px;margin-top:12px}
.ci{display:flex;gap:10px;font-size:13px;line-height:1.6}
.ci .dot{width:16px;height:16px;flex-shrink:0;margin-top:2px;font-size:10px;display:flex;align-items:center;justify-content:center}
.missing-card .dot{color:var(--danger)}
.pos-card .dot{color:var(--safe)}
.ci-main{flex:1}
.ci-main strong{font-weight:600}
.ci-main span{display:block;font-size:11px;color:var(--sub);font-weight:300;margin-top:1px}
.imp{font-size:10px;font-weight:700;padding:1px 6px;flex-shrink:0}
.imp-필수{background:var(--dbg);color:var(--danger)}
.imp-권장{background:var(--wbg);color:var(--warn)}

@media(max-width:600px){
  .statrow,.twocol{grid-template-columns:1fr}
  .main{padding:16px 12px 0}
  .topbar{padding:0 16px}
}
@media(prefers-reduced-motion:reduce){.loadbar::after{animation:none}}
</style>

let curFile=null;

function gk(){try{return localStorage.getItem('lc_gkey')||'';}catch(e){return '';}}
function sk(v){try{localStorage.setItem('lc_gkey',v);}catch(e){}}

function toggleTheme(){
  const r=document.documentElement,c=r.getAttribute('data-theme');
  const nxt=!c?(window.matchMedia('(prefers-color-scheme:dark)').matches?'light':'dark'):c==='dark'?'light':'dark';
  r.setAttribute('data-theme',nxt);
  try{localStorage.setItem('lc_theme',nxt);}catch(e){}
}
function toggleApi(){document.getElementById('apiPanel').classList.toggle('open');}
function saveKey(){
  const v=document.getElementById('apiIn').value.trim();
  if(!v){showErr('API 키를 입력해주세요.');return;}
  sk(v);
  document.getElementById('apiPanel').classList.remove('open');
  updKeyUI();
}
function updKeyUI(){
  const has=!!gk();
  document.getElementById('apiToggle').classList.toggle('ok',has);
  document.getElementById('apiSt').textContent=has?'✓ Gemini API 키 설정됨 (클릭하여 변경)':'🔑 Google Gemini API 키 설정 (분석에 필요)';
  if(has)document.getElementById('apiIn').value=gk();
}

document.getElementById('fileInput').addEventListener('change',function(e){if(e.target.files[0])onFile(e.target.files[0]);});
const dz=document.getElementById('dz');
dz.addEventListener('dragover',function(e){e.preventDefault();dz.classList.add('over');});
dz.addEventListener('dragleave',function(){dz.classList.remove('over');});
dz.addEventListener('drop',function(e){e.preventDefault();dz.classList.remove('over');if(e.dataTransfer.files[0])onFile(e.dataTransfer.files[0]);});
function onFile(f){curFile=f;document.getElementById('dzTitle').textContent='📄 '+f.name;}

async function run(){
  clearErr();
  const key=gk();
  if(!key){showErr('상단 API 키 설정을 먼저 완료해주세요.');document.getElementById('apiPanel').classList.add('open');return;}
  const pasted=document.getElementById('pasteArea').value.trim();
  if(!curFile&&!pasted){showErr('파일을 업로드하거나 내용을 붙여넣어 주세요.');return;}
  setLoad(true);
  try{
    const res=pasted?await doText(pasted,key):await doFile(curFile,key);
    render(res,false);
  }catch(e){showErr('분석 오류: '+e.message);}
  finally{setLoad(false);}
}

async function doFile(f,key){
  const ext=f.name.split('.').pop().toLowerCase();
  step('파일 읽는 중...');
  if(ext==='pdf'){const t=await pdfText(f);step('AI 분석 중...');return call(key,t,'text');}
  if(['jpg','jpeg','png','webp'].includes(ext)){const b=await toB64(f);step('이미지 인식 중...');return call(key,b,f.type||'image/jpeg');}
  if(ext==='txt'){const t=await toText(f);step('AI 분석 중...');return call(key,t,'text');}
  throw new Error('지원하지 않는 파일 형식입니다. PDF, JPG/PNG, TXT 파일을 사용하세요.');
}
async function doText(t,key){step('AI 분석 중...');return call(key,t,'text');}

async function pdfText(f){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=async function(e){
      try{
        const pdf=await pdfjsLib.getDocument({data:e.target.result}).promise;
        let t='';
        for(let i=1;i<=pdf.numPages;i++){
          step('PDF '+i+'/'+pdf.numPages+' 페이지 읽는 중...');
          const pg=await pdf.getPage(i);
          const c=await pg.getTextContent();
          t+=c.items.map(s=>s.str).join(' ')+'\n';
        }
        if(!t.trim())rej(new Error('PDF 텍스트 추출 실패. 이미지 PDF는 JPG로 변환 후 업로드하세요.'));
        else res(t);
      }catch(e){rej(e);}
    };
    r.readAsArrayBuffer(f);
  });
}
function toB64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(f);});}
function toText(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsText(f,'UTF-8');});}

async function call(key,content,ct){
  const parts=ct==='text'
    ?[{text:'다음 근로계약서를 분석해주세요:\n\n'+content}]
    :[{inline_data:{mime_type:ct,data:content}},{text:'이 근로계약서 이미지를 분석해주세요.'}];
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key='+encodeURIComponent(key),{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      system_instruction:{parts:[{text:SYS}]},
      contents:[{parts:parts}],
      generationConfig:{maxOutputTokens:4096,temperature:0.1}
    })
  });
  if(!r.ok){let m='API 오류 ('+r.status+')';try{const e=await r.json();m=e.error?.message||m;}catch(_){}throw new Error(m);}
  const d=await r.json();
  let txt=(d.candidates[0].content.parts[0].text||'').trim().replace(/^```json\s*/i,'').replace(/^```\s*/i,'').replace(/\s*```$/i,'');
  return JSON.parse(txt);
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function rc(lv){return lv==='위험'?'danger':lv==='주의'?'warning':'safe';}
function chip(st){const m={'적합':'safe','안전':'safe','주의':'warn','미달':'danger','위반':'danger','확인불가':'info'};return '<span class="statchip c-'+(m[st]||'info')+'">'+esc(st)+'</span>';}

function render(d,demo){
  document.getElementById('demoBar').style.display=demo?'':'none';
  let h='';

  h+='<div class="risk-banner '+rc(d.risk_level)+'">';
  h+='<div class="risk-lv">검토 결과 · '+esc(d.risk_level)+'</div>';
  h+='<div class="risk-txt">'+esc(d.summary)+'</div></div>';

  h+='<div class="statrow">';
  h+='<div class="statcard"><div class="statcard-head"><span class="statcard-title">최저임금</span>'+chip(d.min_wage.status)+'</div>';
  h+='<div class="statmain">'+esc(d.min_wage.calculated_hourly||'—')+'원/시</div>';
  h+='<div class="statsub">법정 최저: '+esc(d.min_wage.legal_minimum||'—')+'원/시';
  if(d.min_wage.shortage_per_month&&d.min_wage.shortage_per_month!=='0')h+='<br>월 부족: <strong style="color:var(--danger)">'+esc(d.min_wage.shortage_per_month)+'원</strong>';
  h+='<br><span style="font-size:11px;line-height:1.5;display:block;margin-top:4px">'+esc(d.min_wage.detail||'')+'</span></div></div>';

  h+='<div class="statcard"><div class="statcard-head"><span class="statcard-title">근로시간</span>'+chip(d.working_hours?.status||'확인불가')+'</div>';
  h+='<div class="statmain">'+esc(d.working_hours?.weekly_hours||'—')+'</div>';
  h+='<div class="statsub">'+esc(d.working_hours?.detail||'')+'</div></div></div>';

  const iss=d.issues||[];
  h+='<div class="sec-lbl">검토 이슈 · '+iss.length+'건</div><div class="issue-list">';
  if(!iss.length)h+='<div style="padding:14px;background:var(--surface);border:1px solid var(--border);font-size:13px;color:var(--sub)">발견된 이슈가 없습니다.</div>';
  iss.forEach(function(i){
    h+='<div class="issue sv-'+esc(i.severity)+'">';
    h+='<div class="issue-head"><span class="issue-cat">'+esc(i.category)+'</span><span class="issue-sv">'+esc(i.severity)+'</span></div>';
    h+='<div class="issue-desc">'+esc(i.description)+'</div>';
    if(i.legal_basis)h+='<div class="issue-basis">📖 '+esc(i.legal_basis)+'</div>';
    if(i.recommendation)h+='<div class="issue-rec">→ '+esc(i.recommendation)+'</div>';
    h+='</div>';
  });
  h+='</div>';

  const ms=d.missing_clauses||[],ps=d.positive_clauses||[];
  h+='<div class="twocol">';
  h+='<div class="ccard missing-card"><div class="sec-lbl" style="margin-bottom:0">누락 조항</div><ul class="clist">';
  if(!ms.length)h+='<li style="font-size:13px;color:var(--sub)">누락된 필수 조항 없음</li>';
  ms.forEach(function(m){
    h+='<li class="ci"><span class="dot">✕</span><div class="ci-main"><strong>'+esc(m.clause)+'</strong><span>'+esc(m.reason)+'</span></div><span class="imp imp-'+esc(m.importance)+'">'+esc(m.importance)+'</span></li>';
  });
  h+='</ul></div>';

  h+='<div class="ccard pos-card"><div class="sec-lbl" style="margin-bottom:0">적법 확인</div><ul class="clist">';
  if(!ps.length)h+='<li style="font-size:13px;color:var(--sub)">—</li>';
  ps.forEach(function(p){h+='<li class="ci"><span class="dot">✓</span><div class="ci-main">'+esc(p)+'</div></li>';});
  h+='</ul></div></div>';

  document.getElementById('rc').innerHTML=h;
  document.getElementById('results').classList.add('on');
  document.getElementById('results').scrollIntoView({behavior:'smooth',block:'start'});
}

function setLoad(on){
  document.getElementById('loading').classList.toggle('on',on);
  document.getElementById('analyzeBtn').disabled=on;
  document.getElementById('analyzeBtn').textContent=on?'분석 중...':'계약서 분석 시작';
  if(!on)step('');
}
function step(s){document.getElementById('lstep').textContent=s;}
function showErr(m){const b=document.getElementById('errbox');b.textContent=m;b.classList.add('show');}
function clearErr(){document.getElementById('errbox').classList.remove('show');}

(function(){
  try{const t=localStorage.getItem('lc_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
  updKeyUI();
  render(DEMO,true);
})();
</script>
